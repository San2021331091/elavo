name: elavo
description: "A recipe project made using flutter and firebase."

# Prevent accidental publishing to pub.dev
publish_to: 'none' # Remove this line if you want to publish

# Versioning
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  flutter_dotenv: ^6.0.0
  image_picker: ^1.2.1
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Flutter-specific configuration
flutter:
  uses-material-design: true

  assets:
    # - images/
    - .env
  
